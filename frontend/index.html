<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poker Coach — Login</title>

  <!-- Fontes: Space Grotesk + Epilogue -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Epilogue:wght@900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN (sem precisar de build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            poker: {
              bg:      '#0d1f0f',
              surface: '#112413',
              card:    '#0e1c10',
              border:  '#1e3d1e',
              accent:  '#2d6e2d',
              ink:     '#e8f5e8',
              muted:   '#7ec87e',
              faint:   '#4a7a4a',
            }
          },
          fontFamily: {
            display: ['Epilogue', 'sans-serif'],
            body:    ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Firebase Client SDK (autenticação no lado do usuário) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="./css/glass.css">
</head>

<body class="min-h-screen flex items-center justify-center"
      style="background-color: #0d1f0f; font-family: 'Space Grotesk', sans-serif;">

  <!-- Card de Login/Registro -->
  <div class="w-full max-w-md login-glass"
       style="background: #112413; border: 0.5px solid #1e3d1e; border-radius: 4px; padding: 32px;">

    <!-- Logo e título -->
    <div class="text-center mb-8">
      <div style="display:inline-flex;align-items:center;justify-content:center;
                  width:48px;height:48px;border:1.5px solid #2d5a2d;
                  border-radius:4px;margin-bottom:14px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4L4 8v8l8 4 8-4V8L12 4z"
                stroke="#4a9e4a" stroke-width="1.5" fill="none"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold" style="font-family:'Epilogue',sans-serif;font-weight:900;color:#e8f5e8;letter-spacing:-0.5px;">Poker Coach</h1>
      <p class="mt-1" style="color:#4a7a4a; font-size:11px; letter-spacing:2px; text-transform:uppercase;">Plano de Treinamento — 90 Dias</p>
    </div>

    <!-- Abas: Login / Registro -->
    <div class="flex overflow-hidden mb-6" style="border: 0.5px solid #1e3d1e; border-radius: 3px;">
      <button id="tab-login"
              onclick="switchTab('login')"
              class="flex-1 py-2.5 font-medium transition-colors"
              style="background:#1a3a1a; color:#7ec87e; font-size:12px; letter-spacing:1px; text-transform:uppercase;">
        Entrar
      </button>
      <button id="tab-register"
              onclick="switchTab('register')"
              class="flex-1 py-2.5 font-medium transition-colors"
              style="color:#3d6b3d; font-size:12px; letter-spacing:1px; text-transform:uppercase;">
        Criar conta
      </button>
    </div>

    <!-- Formulário de Login -->
    <form id="form-login" onsubmit="handleLogin(event)"
          class="space-y-4">

      <div>
        <label class="block mb-1" style="font-size:10px;color:#4a7a4a;letter-spacing:2px;text-transform:uppercase;">E-mail</label>
        <input type="email" id="login-email" required
               class="w-full px-4 py-3 text-sm outline-none"
               style="background:#0d1f0f; border:0.5px solid #1e3d1e; border-radius:3px; color:#e8f5e8; font-family:'Space Grotesk',sans-serif;"
               placeholder="seu@email.com" />
      </div>

      <div>
        <label class="block mb-1" style="font-size:10px;color:#4a7a4a;letter-spacing:2px;text-transform:uppercase;">Senha</label>
        <input type="password" id="login-password" required
               class="w-full px-4 py-3 text-sm outline-none"
               style="background:#0d1f0f; border:0.5px solid #1e3d1e; border-radius:3px; color:#e8f5e8; font-family:'Space Grotesk',sans-serif;"
               placeholder="••••••••" />
      </div>

      <!-- Mensagem de erro -->
      <p id="login-error" class="text-red-400 text-sm hidden"></p>

      <button type="submit" id="btn-login"
              class="w-full py-3 font-semibold transition-opacity hover:opacity-90"
              style="background:#2d6e2d; color:#e8f5e8; border-radius:3px; font-family:'Space Grotesk',sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase;">
        Entrar
      </button>

      <p class="text-center text-sm">
        <button type="button" onclick="handleResetPassword()"
                class="hover:underline"
                style="color:#4a7a4a; font-size:11px; letter-spacing:1px;">
          Esqueci minha senha
        </button>
      </p>

      <!-- Divisor -->
      <div class="flex items-center gap-3">
        <div class="flex-1 h-px" style="background:#1e3d1e;"></div>
        <span style="color:#2d5a2d; font-size:10px; letter-spacing:2px;">ou</span>
        <div class="flex-1 h-px" style="background:#1e3d1e;"></div>
      </div>

      <!-- Botão Google -->
      <button type="button" onclick="handleGoogleLogin()"
              class="w-full py-3 font-medium flex items-center justify-center gap-3 transition-colors"
              style="background:transparent; border:0.5px solid #2d5a2d; border-radius:3px; color:#4a7a4a; font-family:'Space Grotesk',sans-serif;">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.4-2.5 4.4-4.6 5.8l6.2 5.2C40.8 35.5 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/>
        </svg>
        Entrar com Google
      </button>
    </form>

    <!-- Formulário de Registro (oculto por padrão) -->
    <form id="form-register" onsubmit="handleRegister(event)"
          class="space-y-4 hidden">

      <div>
        <label class="block mb-1" style="font-size:10px;color:#4a7a4a;letter-spacing:2px;text-transform:uppercase;">Nome completo</label>
        <input type="text" id="reg-name" required
               class="w-full px-4 py-3 text-sm outline-none"
               style="background:#0d1f0f; border:0.5px solid #1e3d1e; border-radius:3px; color:#e8f5e8; font-family:'Space Grotesk',sans-serif;"
               placeholder="Seu nome" />
      </div>

      <div>
        <label class="block mb-1" style="font-size:10px;color:#4a7a4a;letter-spacing:2px;text-transform:uppercase;">E-mail</label>
        <input type="email" id="reg-email" required
               class="w-full px-4 py-3 text-sm outline-none"
               style="background:#0d1f0f; border:0.5px solid #1e3d1e; border-radius:3px; color:#e8f5e8; font-family:'Space Grotesk',sans-serif;"
               placeholder="seu@email.com" />
      </div>

      <div>
        <label class="block mb-1" style="font-size:10px;color:#4a7a4a;letter-spacing:2px;text-transform:uppercase;">Senha</label>
        <input type="password" id="reg-password" required minlength="6"
               class="w-full px-4 py-3 text-sm outline-none"
               style="background:#0d1f0f; border:0.5px solid #1e3d1e; border-radius:3px; color:#e8f5e8; font-family:'Space Grotesk',sans-serif;"
               placeholder="Mínimo 6 caracteres" />
      </div>

      <div>
        <label class="block mb-1" style="font-size:10px;color:#4a7a4a;letter-spacing:2px;text-transform:uppercase;">Confirmar senha</label>
        <input type="password" id="reg-confirm" required minlength="6"
               class="w-full px-4 py-3 text-sm outline-none"
               style="background:#0d1f0f; border:0.5px solid #1e3d1e; border-radius:3px; color:#e8f5e8; font-family:'Space Grotesk',sans-serif;"
               placeholder="Repita a senha" />
      </div>

      <p id="reg-error" class="text-red-400 text-sm hidden"></p>

      <button type="submit" id="btn-register"
              class="w-full py-3 font-semibold transition-opacity hover:opacity-90"
              style="background:#2d6e2d; color:#e8f5e8; border-radius:3px; font-family:'Space Grotesk',sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase;">
        Criar minha conta
      </button>
    </form>

  </div><!-- /card -->

  <!-- Módulos JS do projeto (type="module" habilita import/export) -->
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
