<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil — Poker Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        poker: { bg:'#0a0b0a', surface:'#111412', card:'#161a16', gold:'#c8a045' }
      }}}
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="../css/glass.css">
</head>

<body class="min-h-screen pb-24 text-white" style="background:#0a0b0a;">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 border-b border-white/5" style="background:#111412;">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/pages/dashboard.html" class="text-gray-400 hover:text-white text-sm">← Dashboard</a>
        <span class="text-white/20">|</span>
        <span class="text-white font-semibold text-sm">Meu Perfil</span>
      </div>
      <button onclick="logout()" class="text-sm text-red-400 hover:underline">Sair</button>
    </div>
  </nav>

  <main class="max-w-lg mx-auto px-4 py-8 space-y-6">

    <!-- Card de identidade -->
    <div class="rounded-2xl p-6 text-center space-y-3" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
      <div id="profile-avatar"
           class="w-20 h-20 rounded-full flex items-center justify-center text-2xl font-bold mx-auto"
           style="background:#c8a045; color:#000;">?</div>
      <div>
        <h1 id="profile-name" class="text-xl font-bold text-white">—</h1>
        <p id="profile-email" class="text-sm text-gray-400 mt-1">—</p>
      </div>
      <span id="profile-role"
            class="inline-block text-xs font-bold px-3 py-1 rounded-full"
            style="background:rgba(255,255,255,0.05); color:#9ca3af;">user</span>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 gap-3">
      <div class="rounded-xl p-4 text-center" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
        <p class="text-xs text-gray-400 mb-1">XP Total</p>
        <p id="stat-xp" class="text-2xl font-bold" style="color:#c8a045;">—</p>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
        <p class="text-xs text-gray-400 mb-1">Streak</p>
        <p id="stat-streak" class="text-2xl font-bold text-white">— 🔥</p>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
        <p class="text-xs text-gray-400 mb-1">Lições concluídas</p>
        <p id="stat-completed" class="text-2xl font-bold text-white">—</p>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
        <p class="text-xs text-gray-400 mb-1">Dia atual</p>
        <p id="stat-day" class="text-2xl font-bold text-white">—</p>
      </div>
    </div>

    <!-- Barra de progresso -->
    <div class="rounded-xl p-4" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
      <div class="flex justify-between text-xs text-gray-400 mb-2">
        <span>Progresso do currículo</span>
        <span id="stat-percent">—%</span>
      </div>
      <div class="h-2 rounded-full" style="background:rgba(255,255,255,0.08);">
        <div id="progress-bar" class="h-2 rounded-full transition-all" style="background:#c8a045; width:0%;"></div>
      </div>
    </div>

    <!-- Formulário de edição -->
    <div class="rounded-2xl p-6 space-y-4" style="background:#161a16; border:1px solid rgba(255,255,255,0.06);">
      <h2 class="text-sm font-semibold text-gray-300">Editar perfil</h2>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Nome de exibição</label>
        <input id="input-name" type="text" maxlength="60"
               class="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
               style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);"
               placeholder="Seu nome" />
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">URL do avatar <span class="text-gray-600">(opcional)</span></label>
        <input id="input-avatar" type="url" maxlength="500"
               class="w-full px-3 py-2 rounded-lg text-sm text-white outline-none"
               style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);"
               placeholder="https://..." />
      </div>

      <div id="edit-feedback" class="text-xs hidden"></div>

      <button onclick="saveProfile()"
              class="w-full py-2 rounded-lg text-sm font-semibold text-black"
              style="background:#c8a045;">
        Salvar
      </button>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script type="module" src="../js/config.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/api.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
